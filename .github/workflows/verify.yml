name: portfolio-verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Python dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Install OPA from upstream release
        run: |
          curl -fsSL https://github.com/open-policy-agent/opa/releases/download/v1.4.2/opa_linux_amd64_static -o opa
          curl -fsSL https://github.com/open-policy-agent/opa/releases/download/v1.4.2/opa_linux_amd64_static.sha256 -o opa.sha256
          echo "$(cut -d ' ' -f1 opa.sha256)  opa" | sha256sum -c -
          chmod +x opa
          echo "OPA_BIN=$PWD/opa" >> "$GITHUB_ENV"
      - name: Install audit and browser tooling
        run: |
          python -m pip install -r requirements-audit.txt
          npm install --no-save playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Initialize isolated demo runtime
        run: python -m scripts.portfolio init
      - name: Verify one code state end to end
        run: python -m scripts.verify_release
      - name: Preserve evidence, never runtime secrets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-evidence
          path: evidence/
      - name: Stop only this deployment
        if: always()
        run: python -m scripts.portfolio down
