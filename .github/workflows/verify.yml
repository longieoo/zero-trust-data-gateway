name: portfolio-verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Python dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Install OPA from upstream release
        run: |
          curl -fsSL https://github.com/open-policy-agent/opa/releases/download/v1.4.2/opa_linux_amd64_static -o opa
          curl -fsSL https://github.com/open-policy-agent/opa/releases/download/v1.4.2/opa_linux_amd64_static.sha256 -o opa.sha256
          echo "$(cut -d ' ' -f1 opa.sha256)  opa" | sha256sum -c -
          chmod +x opa
          echo "OPA_BIN=$PWD/opa" >> "$GITHUB_ENV"
      - name: Lint and automated security regressions
        run: |
          python -m ruff check app tests scripts
          python -m pytest -q --junitxml=evidence/pytest.xml
          node tests/ui/gateway_session.cjs
      - name: Fresh local deployment and live failure recovery
        run: |
          python -m scripts.portfolio init
          python -m scripts.portfolio doctor
          python -m scripts.portfolio up
          python -m scripts.validate_portfolio
      - name: Browser verification
        run: |
          npm install --no-save playwright@1.62.1
          npx playwright install --with-deps chromium
          node tests/ui/portfolio_live.cjs
      - name: Bounded benchmark
        run: python -m scripts.benchmark_portfolio
      - name: Python dependency audit
        run: |
          python -m pip install -r requirements-audit.txt
          python -m pip_audit -r requirements-lock.txt -f json -o evidence/dependency-audit.json
      - name: Preserve evidence, never runtime secrets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-evidence
          path: evidence/
      - name: Stop only this deployment
        if: always()
        run: python -m scripts.portfolio down
