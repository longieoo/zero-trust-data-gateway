<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="880" viewBox="0 0 1500 880">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#267d73"/></marker><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#19324b}.title{font-size:32px;font-weight:700}.label{font-size:18px;font-weight:700}.body{font-size:16px}.small{font-size:14px;fill:#5f7484}.node{fill:white;stroke:#cbdcd7;stroke-width:2}.arrow{fill:none;stroke:#267d73;stroke-width:3;marker-end:url(#arrow)}</style></defs>
<rect width="1500" height="880" fill="#f2f6f5"/><text x="50" y="60" class="title">Zero Trust Data Access Platform</text><text x="50" y="92" class="small">Implementation v5 · five logical responsibilities / four containers · local portfolio deployment</text>
<rect x="45" y="145" width="1410" height="330" rx="20" fill="#e5efeb"/><text x="65" y="177" class="label">DATA PLANE · a single verified policy release per request</text>
<rect x="65" y="215" width="240" height="190" rx="12" class="node"/><text x="85" y="249" class="label">1 / INGRESS</text><text x="85" y="285" class="body">Nginx · mTLS X.509</text><text x="85" y="315" class="body">Overwrite trusted headers</text><text x="85" y="345" class="body">Loopback HTTPS :28443</text><text x="85" y="379" class="small">Client certificate + identity</text>
<rect x="345" y="215" width="240" height="190" rx="12" class="node"/><text x="365" y="249" class="label">2 / GATEWAY PEP</text><text x="365" y="285" class="body">JWT / serial / tenant</text><text x="365" y="315" class="body">Shared session allowlist</text><text x="365" y="345" class="body">Fail-closed enforcement</text><text x="365" y="379" class="small">FastAPI · strict contracts</text>
<rect x="625" y="215" width="240" height="190" rx="12" class="node"/><text x="645" y="249" class="label">3 / ATTRIBUTE PIP</text><text x="645" y="285" class="body">Account/resource registry</text><text x="645" y="315" class="body">TLS / peer IP / clock</text><text x="645" y="345" class="body">Input + provenance</text><text x="645" y="379" class="small">Server-side observations</text>
<rect x="905" y="215" width="240" height="190" rx="12" class="node"/><text x="925" y="249" class="label">4 / POLICY PDP</text><text x="925" y="285" class="body">OPA Rego evaluation</text><text x="925" y="315" class="body">Outcomes + view plan</text><text x="925" y="345" class="body">Revision checked</text><text x="925" y="379" class="small">Deny-overrides combiner</text>
<rect x="1185" y="215" width="250" height="190" rx="12" class="node"/><text x="1205" y="249" class="label">5 / DATA PEP</text><text x="1205" y="285" class="body">SQL column masking</text><text x="1205" y="315" class="body">Tenant AND department</text><text x="1205" y="345" class="body">FORCE RLS / SELECT role</text><text x="1205" y="379" class="small">PostgreSQL 16</text>
<path d="M305 305H342M585 305H622M865 305H902M1145 305H1182" class="arrow"/>
<text x="65" y="447" class="small">DENY, invalid release, PDP outage, invalid obligations or audit failure → no successful protected-data response</text>
<rect x="65" y="535" width="650" height="205" rx="14" class="node"/><text x="90" y="570" class="label">CONTROL PLANE · signed release workflow</text><text x="90" y="609" class="body">Author → historical impact analysis → independent reviewer</text><text x="90" y="644" class="body">Two Ed25519 public keys → verified activation → verified rollback</text><text x="90" y="683" class="small">Immutable SHA-256 release + atomic active pointer. Private signing keys</text><text x="90" y="707" class="small">remain outside the Gateway container. Demo keys share one local host.</text>
<rect x="765" y="535" width="670" height="205" rx="14" class="node"/><text x="790" y="570" class="label">AUDIT &amp; REPLAY · encrypted historical snapshots</text><text x="790" y="609" class="body">received → intent (before SELECT) → response (before delivery)</text><text x="790" y="644" class="body">AES-GCM / SQLite WAL → tenant-scoped timeline → decision replay</text><text x="790" y="683" class="small">MATCH / MISMATCH / UNREPLAYABLE. Replay does not reconstruct</text><text x="790" y="707" class="small">historical business rows. Audit is single-host, not a distributed service.</text>
<path d="M390 535V498H1015V407" class="arrow"/><path d="M1310 407V510H1100V532" class="arrow"/>
<text x="65" y="800" class="label">Trust boundary</text><text x="65" y="830" class="small">The Gateway, OPA and deployment host are trusted. RLS does not defend against a fully compromised PEP holding its database credential.</text>
</svg>
